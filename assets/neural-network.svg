<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 420"
  width="1200"
  height="420"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Animated neural network banner for Aarush Sharma</title>
  <desc id="description">
    An animated neural network with glowing nodes and data signals moving
    from the input layer through hidden layers to the output layer.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#07152c"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff">
        <animate
          attributeName="stop-color"
          values="#00e5ff;#7c3aed;#00e5ff"
          dur="5s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="50%" stop-color="#7c3aed">
        <animate
          attributeName="stop-color"
          values="#7c3aed;#22d3ee;#7c3aed"
          dur="5s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate
          attributeName="stop-color"
          values="#22d3ee;#a855f7;#22d3ee"
          dur="5s"
          repeatCount="indefinite"
        />
      </stop>
    </linearGradient>

    <linearGradient id="signalGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="nodeGradient">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#38bdf8"
        stroke-width="0.7"
        opacity="0.12"
      />
    </pattern>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>

  <!-- Moving scan line -->
  <rect
    x="0"
    y="-80"
    width="1200"
    height="80"
    fill="#00e5ff"
    opacity="0.035"
  >
    <animate
      attributeName="y"
      from="-80"
      to="420"
      dur="5s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Border -->
  <rect
    x="5"
    y="5"
    width="1190"
    height="410"
    rx="20"
    fill="none"
    stroke="url(#signalGradient)"
    stroke-width="2"
    opacity="0.6"
  >
    <animate
      attributeName="opacity"
      values="0.35;0.9;0.35"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Header -->
  <text
    x="600"
    y="52"
    text-anchor="middle"
    fill="url(#titleGradient)"
    font-family="monospace"
    font-size="29"
    font-weight="700"
    letter-spacing="4"
    filter="url(#glow)"
  >
    AARUSH.SHARMA // INTELLIGENT SYSTEMS
  </text>

  <text
    x="600"
    y="79"
    text-anchor="middle"
    fill="#94a3b8"
    font-family="monospace"
    font-size="13"
    letter-spacing="3"
  >
    DATA → REPRESENTATION → LEARNING → PREDICTION
  </text>

  <!-- Network connection paths -->
  <g
    fill="none"
    stroke="url(#signalGradient)"
    stroke-width="1.4"
    opacity="0.28"
  >
    <path id="p1" d="M175 145 C310 145 380 115 500 110"/>
    <path id="p2" d="M175 145 C315 155 390 200 500 200"/>
    <path id="p3" d="M175 145 C320 175 395 270 500 290"/>

    <path id="p4" d="M175 205 C310 180 385 125 500 110"/>
    <path id="p5" d="M175 205 C315 205 390 200 500 200"/>
    <path id="p6" d="M175 205 C315 225 390 275 500 290"/>

    <path id="p7" d="M175 265 C310 235 390 145 500 110"/>
    <path id="p8" d="M175 265 C315 245 390 210 500 200"/>
    <path id="p9" d="M175 265 C315 265 390 285 500 290"/>

    <path id="p10" d="M175 325 C310 270 390 155 500 110"/>
    <path id="p11" d="M175 325 C315 300 390 235 500 200"/>
    <path id="p12" d="M175 325 C315 315 390 295 500 290"/>

    <path id="p13" d="M530 110 C650 110 710 150 820 165"/>
    <path id="p14" d="M530 110 C650 145 710 230 820 265"/>
    <path id="p15" d="M530 200 C650 185 710 170 820 165"/>
    <path id="p16" d="M530 200 C650 210 710 245 820 265"/>
    <path id="p17" d="M530 290 C650 245 710 185 820 165"/>
    <path id="p18" d="M530 290 C650 290 710 270 820 265"/>

    <path id="p19" d="M850 165 C930 165 970 195 1040 215"/>
    <path id="p20" d="M850 265 C930 260 970 235 1040 215"/>
  </g>

  <!-- Animated data signals -->
  <g fill="#00e5ff" filter="url(#strongGlow)">
    <circle r="4">
      <animateMotion dur="2.4s" repeatCount="indefinite">
        <mpath href="#p1"/>
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion dur="3.1s" begin="-1.1s" repeatCount="indefinite">
        <mpath href="#p5"/>
      </animateMotion>
    </circle>

    <circle r="4">
      <animateMotion dur="2.7s" begin="-1.8s" repeatCount="indefinite">
        <mpath href="#p9"/>
      </animateMotion>
    </circle>

    <circle r="3">
      <animateMotion dur="3.4s" begin="-0.7s" repeatCount="indefinite">
        <mpath href="#p11"/>
      </animateMotion>
    </circle>

    <circle r="4">
      <animateMotion dur="2.3s" begin="-0.8s" repeatCount="indefinite">
        <mpath href="#p13"/>
      </animateMotion>
    </circle>

    <circle r="3.5">
      <animateMotion dur="2.9s" begin="-2s" repeatCount="indefinite">
        <mpath href="#p16"/>
      </animateMotion>
    </circle>

    <circle r="4">
      <animateMotion dur="2.6s" begin="-1.4s" repeatCount="indefinite">
        <mpath href="#p18"/>
      </animateMotion>
    </circle>

    <circle r="5" fill="#f472b6">
      <animateMotion dur="2s" repeatCount="indefinite">
        <mpath href="#p19"/>
      </animateMotion>
    </circle>

    <circle r="5" fill="#a855f7">
      <animateMotion dur="2.2s" begin="-1s" repeatCount="indefinite">
        <mpath href="#p20"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Input nodes -->
  <g fill="url(#nodeGradient)" stroke="#67e8f9" stroke-width="2" filter="url(#glow)">
    <circle cx="160" cy="145" r="13">
      <animate attributeName="r" values="12;16;12" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="205" r="13">
      <animate attributeName="r" values="13;16;13" dur="2.8s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="265" r="13">
      <animate attributeName="r" values="12;16;12" dur="2.4s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="325" r="13">
      <animate attributeName="r" values="13;16;13" dur="3s" begin="-1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hidden nodes -->
  <g fill="url(#nodeGradient)" stroke="#a78bfa" stroke-width="2" filter="url(#glow)">
    <circle cx="515" cy="110" r="16">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="515" cy="200" r="16">
      <animate attributeName="opacity" values="1;0.6;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="515" cy="290" r="16">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Representation nodes -->
  <g fill="url(#nodeGradient)" stroke="#f472b6" stroke-width="2" filter="url(#glow)">
    <circle cx="835" cy="165" r="18">
      <animate attributeName="r" values="17;21;17" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="835" cy="265" r="18">
      <animate attributeName="r" values="18;21;18" dur="2.8s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Output node -->
  <g filter="url(#strongGlow)">
    <circle
      cx="1055"
      cy="215"
      r="28"
      fill="#0f172a"
      stroke="url(#signalGradient)"
      stroke-width="4"
    >
      <animate
        attributeName="stroke-width"
        values="3;7;3"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="1055"
      y="222"
      text-anchor="middle"
      fill="#ffffff"
      font-family="monospace"
      font-size="19"
      font-weight="700"
    >
      ŷ
    </text>
  </g>

  <!-- Labels -->
  <g
    fill="#94a3b8"
    font-family="monospace"
    font-size="12"
    letter-spacing="2"
    text-anchor="middle"
  >
    <text x="160" y="370">INPUT DATA</text>
    <text x="515" y="335">FEATURE LAYER</text>
    <text x="835" y="315">LEARNED STATE</text>
    <text x="1055" y="270">PREDICTION</text>
  </g>

  <!-- Bottom model equation -->
  <text
    x="600"
    y="397"
    text-anchor="middle"
    fill="#67e8f9"
    font-family="monospace"
    font-size="14"
    letter-spacing="2"
  >
    h = σ(Wx + b)  //  optimise(loss)  //  infer(x) → ŷ
    <animate
      attributeName="opacity"
      values="0.4;1;0.4"
      dur="3s"
      repeatCount="indefinite"
    />
  </text>

  <!-- Corner indicators -->
  <g fill="#22d3ee">
    <circle cx="30" cy="30" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1170" cy="30" r="3">
      <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="390" r="3">
      <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1170" cy="390" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
